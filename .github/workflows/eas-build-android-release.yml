name: EAS Build Android Release

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0

      - name: 🚀 Build Production APK (arm64-v8a)
        run: eas build --profile production --platform android --local --non-interactive
        env:
          EXPO_NO_TELEMETRY: 1
          NODE_OPTIONS: "--max-old-space-size=3072"
          GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
          ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a"

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: "*.apk"

      - name: 🚀 Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: "*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
